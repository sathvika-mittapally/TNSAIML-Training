<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AQI Prediction</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 2rem; }
    .result { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1 class="mb-4">Air Quality Index (AQI) Prediction</h1>
  <form id="aqiForm">
    <div class="row g-3">
      <div class="col-md-4"><input class="form-control" name="Temperature" placeholder="Temperature (°C)" required></div>
      <div class="col-md-4"><input class="form-control" name="Humidity" placeholder="Humidity (%)" required></div>
      <div class="col-md-4"><input class="form-control" name="Wind_Speed" placeholder="Wind Speed (km/h)" required></div>

      <div class="col-md-4"><input class="form-control" name="PM2.5" placeholder="PM2.5 (µg/m³)" required></div>
      <div class="col-md-4"><input class="form-control" name="PM10" placeholder="PM10 (µg/m³)" required></div>
      <div class="col-md-4"><input class="form-control" name="NO2" placeholder="NO2 (ppb)" required></div>

      <div class="col-md-4"><input class="form-control" name="SO2" placeholder="SO2 (ppb)" required></div>
      <div class="col-md-4"><input class="form-control" name="CO" placeholder="CO (ppm)" required></div>
      <div class="col-md-4"><input class="form-control" name="O3" placeholder="O3 (ppb)" required></div>
    </div>
    <button type="submit" class="btn btn-primary mt-4">Predict AQI</button>
  </form>

  <div id="result" class="result"></div>

  <script>
    const form = document.getElementById('aqiForm');
    const resultDiv = document.getElementById('result');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      // Convert numeric fields to numbers (optional but nice)
      for (const key of Object.keys(data)) {
        const val = data[key];
        data[key] = isNaN(val) ? val : Number(val);
      }
      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await response.json();
        if (response.ok) {
          resultDiv.innerHTML = `<h3>Predicted AQI: ${json.predicted_AQI}</h3>`;
        } else {
          resultDiv.innerHTML = `<pre style="color:red;">Error: ${JSON.stringify(json, null, 2)}</pre>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<pre style="color:red;">${err}</pre>`;
      }
    });
  </script>
</body>
</html>
